[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducibility-lab"
version = "0.1.0"
description = "Research prototype for content-addressed coding verification and VAP reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vap-lab = "vap_lab.cli:main"

[tool.setuptools]
packages = ["vap_lab"]
