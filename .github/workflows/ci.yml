name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    name: Python ${{ matrix.python-version }} / unit and contract checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository contract
        run: python scripts/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit synthetic CSV fixture
        run: python verify_csv.py examples/demo_sales.csv --out "$RUNNER_TEMP/proofline-audit"
      - name: Compile Python sources
        run: python -m compileall -q verify_csv.py scripts tests
      - name: Check whitespace
        run: git diff --check

  chromium-interactions:
    name: Browser interaction tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install browser-test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test actual browser interactions
        run: python tests/browser_test.py
